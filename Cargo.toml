[package]
name = "php-tokio"
repository = "https://github.com/danog/php-tokio"
homepage = "https://github.com/danog/php-tokio"
license = "Apache-2.0"
description = "Use any async Rust library from PHP!"
version = "0.1.7"
authors = ["Daniil Gentili <daniil@daniil.it>"]
edition = "2021"

[dependencies]
ext-php-rs = "^0.16.3"
tokio = { version = "1.53", features = ["full"] }
lazy_static = "1.5.0"
php-tokio-derive = { version = "=0.2.0", path = "./crates/macros" }

[target.'cfg(windows)'.dependencies]
socket2 = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Networking_WinSock", "Win32_System_IO"] }

[workspace]
members = [
    "crates/macros",
    "crates/test-extension",
    "examples/reqwest",
]

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docs"]

